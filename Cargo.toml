[package]
name = "firebase-environment-doctor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only Firebase project, credential, emulator, and rules preflight"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-firebase-environment-doctor"
homepage = "https://firebase-environment-doctor.sociobot.in"
readme = "README.md"
keywords = ["firebase", "cli", "diagnostics", "emulator", "preflight"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", "dist/", "graphify-out/", ".factory/"]

[[bin]]
name = "firebase-environment-doctor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"
